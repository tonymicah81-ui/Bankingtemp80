<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartsupp Link Test</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      text-align: center;
    }

    .box {
      padding: 40px;
      max-width: 650px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 16px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    .chat-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding: 16px 24px;
      border-radius: 999px;
      background: white;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chat-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Hello World</h1>
    <p>This is a completely standalone Smartsupp link test.</p>
    <p>Click the button below to open the Smartsupp widget page.</p>

    <a
      class="chat-button"
      href="https://widget-page.smartsupp.com/widget/df1482b6d91868689a46dd6f8b855f77a9bbf56e"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open Smartsupp Chat
    </a>
  </div>
</body>
</html>
